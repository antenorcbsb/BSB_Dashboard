<BSB Dashboard html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard BSB - Operacional</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #ef4444;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      border-left: 6px solid var(--accent-red);
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
    }

    .status-badge {
      background-color: #334155;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: var(--text-muted);
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    /* Estilos do Teatro de Operacoes e Canais */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #0f172a;
      padding: 12px 16px;
      border-radius: 8px;
    }

    .info-label {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .info-value {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .badge-canal {
      background-color: var(--accent-blue);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 1rem;
    }

    /* Tabela de Viaturas */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #334155;
    }

    th {
      color: var(--text-muted);
    }

    .status-operacional {
      color: var(--accent-green);
      font-weight: bold;
    }

    .status-inop {
      color: var(--accent-red);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>PAINEL OPERACIONAL - BSB BRAGA</h1>
    <div class="status-badge" id="relogio">--:--:--</div>
  </header>

  <div class="grid-container">
    
    <!-- QUADRO 1: VIATURAS -->
    <div class="card">
      <h2>Estado das Viaturas</h2>
      <table>
        <thead>
          <tr>
            <th>Viatura</th>
            <th>Tipo</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tabela-viaturas">
          <tr>
            <td colspan="3">A carregar dados das viaturas...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- QUADRO 2: TEATRO DE OPERAÇÕES & CANAIS -->
    <div class="card">
      <h2>Teatro de Operações / Canais</h2>
      <div class="info-list">
        
        <div class="info-item">
          <span class="info-label">Teatro de Operações (TO)</span>
          <span class="info-value" id="to-local">--</span>
        </div>

        <div class="info-item">
          <span class="info-label">Comandante de Operações (COS)</span>
          <span class="info-value" id="to-cos">--</span>
        </div>

        <div class="info-item">
          <span class="info-label">Canal SIRESP Principal</span>
          <span class="info-value badge-canal" id="canal-siresp">--</span>
        </div>

        <div class="info-item">
          <span class="info-label">Outras Frequências / Canais</span>
          <span class="info-value" id="canais-outros">--</span>
        </div>

      </div>
    </div>

  </div>

  <script>
    const SHEET_ID = '1ma86jNoDbIG9acIgHx6imCPWWjKVZ-ka3k1mF61BtXo';
    const GID_COMUNICACOES = '1346973124'; // Aba de Canais/TO

    // URLs dos CSVs do Google Sheets
    const URL_VIATURAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const URL_COMUNICACOES = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_COMUNICACOES}`;

    // Parser manual para converter texto CSV em Objetos JavaScript
    function parseCSV(text) {
      const linhas = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (linhas.length < 2) return [];

      const parseLinha = (linha) => {
        const res = [];
        let cur = '';
        let dentroAspas = false;
        for (let i = 0; i < linha.length; i++) {
          const c = linha[i];
          if (c === '"') dentroAspas = !dentroAspas;
          else if (c === ',' && !dentroAspas) {
            res.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += c;
          }
        }
        res.push(cur.trim().replace(/^"|"$/g, ''));
        return res;
      };

      const cabecalhos = parseLinha(linhas[0]);
      return linhas.slice(1).map(linha => {
        const valores = parseLinha(linha);
        const obj = {};
        cabecalhos.forEach((cabecalho, idx) => {
          obj[cabecalho.trim()] = valores[idx] || '';
        });
        return obj;
      });
    }

    // 1. Atualizar Teatro de Operações e Canais
    async function atualizarTeatroECanais() {
      try {
        const res = await fetch(`${URL_COMUNICACOES}&_t=${Date.now()}`);
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        if (dados.length > 0) {
          const linha = dados[0];

          document.getElementById('to-local').textContent = linha['TO'] || linha['Teatro de Operações'] || 'Sem TO Ativo';
          document.getElementById('to-cos').textContent = linha['COS'] || linha['Comandante'] || '--';
          document.getElementById('canal-siresp').textContent = linha['Canais'] || linha['SIRESP'] || linha['Canal'] || '--';
          document.getElementById('canais-outros').textContent = linha['Frequência'] || linha['Outros'] || '--';
        }
      } catch (err) {
        console.error("Erro ao carregar comunicações:", err);
      }
    }

    // 2. Atualizar Lista de Viaturas
    async function atualizarViaturas() {
      try {
        const res = await fetch(`${URL_VIATURAS}&_t=${Date.now()}`);
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const tbody = document.getElementById('tabela-viaturas');
        tbody.innerHTML = '';

        dados.forEach(v => {
          const nome = v['Viatura'] || v['Veículo'] || 'N/A';
          const tipo = v['Tipo'] || 'N/A';
          const estado = (v['Estado Operacional'] || v['Estado'] || '').toUpperCase();

          const tr = document.createElement('tr');
          const estadoClasse = (estado.includes('INOP')) ? 'status-inop' : 'status-operacional';

          tr.innerHTML = `
            <td><strong>${nome}</strong></td>
            <td>${tipo}</td>
            <td class="${estadoClasse}">${estado || 'OPERACIONAL'}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("Erro ao carregar viaturas:", err);
      }
    }

    // Relógio Digital
    function atualizarRelogio() {
      const agora = new Date();
      document.getElementById('relogio').textContent = agora.toLocaleTimeString('pt-PT');
    }

    // Inicialização
    function carregarDados() {
      atualizarTeatroECanais();
      atualizarViaturas();
    }

    setInterval(carregarDados, 10000); // Atualiza de 10 em 10 segundos
    setInterval(atualizarRelogio, 1000); // Relógio a cada segundo
    carregarDados();
    atualizarRelogio();
  </script>
</body>
</html>
