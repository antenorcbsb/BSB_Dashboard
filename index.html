<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batalhão Sapadores Bombeiros de Braga - Situação Operacional</title>
  <!-- Ícones Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #060b17;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --accent-green: #10b981;
      --accent-blue: #0284c7;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-purple: #a855f7;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* Trava o ecrã para evitar qualquer barra de scroll */
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: clamp(8px, 1.2vh, 16px);
      padding-bottom: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1vh, 12px);
    }

    /* Cada secção divide a altura do ecrã proporcionalmente */
    section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .seccao-titulo {
      font-size: clamp(0.75rem, 1.2vh, 0.95rem);
      font-weight: 800;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .grid-cards {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: clamp(6px, 1vw, 10px);
      min-height: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: clamp(6px, 1vh, 10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }

    /* CARD TEATRO DE OPERACOES / CANAIS */
    .card-to {
      border-left: 4px solid var(--accent-green);
    }

    .to-nome {
      font-size: clamp(0.85rem, 1.3vh, 1.05rem);
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .to-detalhes {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: clamp(0.75rem, 1.1vh, 0.85rem);
      color: var(--text-muted);
    }

    .badge-canal {
      display: inline-block;
      background-color: var(--accent-blue);
      color: #fff;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: clamp(0.7rem, 1vh, 0.8rem);
    }

    /* CARD VIATURAS INOP */
    .card-inop {
      border-left: 4px solid var(--accent-red);
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .inop-esquerda {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1vw, 12px);
      overflow: hidden;
      flex: 1;
    }

    /* Contentor do Ícone/SVG do Veículo */
    .inop-icon-box {
      width: clamp(38px, 3.8vw, 48px);
      height: clamp(38px, 3.8vw, 48px);
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 6px;
    }

    .inop-icon-box svg {
      width: 100%;
      height: 100%;
      fill: var(--accent-red);
    }

    .inop-info {
      overflow: hidden;
    }

    .inop-info h4 {
      font-size: clamp(0.85rem, 1.3vh, 1rem);
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .inop-info p {
      font-size: clamp(0.75rem, 1.1vh, 0.85rem);
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-inop {
      background-color: var(--accent-red);
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(0.65rem, 1vh, 0.75rem);
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* CARD AGENDAMENTOS */
    .card-agendamento {
      border-left: 4px solid var(--accent-orange);
    }

    .agendamento-data {
      color: var(--accent-orange);
      font-weight: 700;
      font-size: clamp(0.75rem, 1.1vh, 0.85rem);
    }

    .agendamento-desc {
      font-size: clamp(0.85rem, 1.2vh, 0.95rem);
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agendamento-meios {
      font-size: clamp(0.75rem, 1.1vh, 0.85rem);
      color: #38bdf8;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* CARD OBSERVAÇÕES */
    .card-observacao {
      border-left: 4px solid var(--accent-purple);
    }

    .obs-titulo {
      font-weight: 700;
      color: #c084fc;
      font-size: clamp(0.7rem, 1vh, 0.8rem);
      text-transform: uppercase;
    }

    .obs-texto {
      font-size: clamp(0.8rem, 1.2vh, 0.95rem);
      font-weight: 600;
      color: #ffffff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sem-registos {
      color: var(--text-muted);
      font-style: italic;
      padding: 6px;
      font-size: clamp(0.75rem, 1.1vh, 0.85rem);
    }

    /* BARRA RODAPÉ IPMA (TICKER) */
    .rodape-ticker {
      height: clamp(36px, 5vh, 44px);
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      font-weight: 700;
      font-size: clamp(0.75rem, 1.1vh, 0.85rem);
      border-top: 2px solid var(--accent-blue);
      flex-shrink: 0;
      margin-left: calc(-1 * clamp(8px, 1.2vh, 16px));
      margin-right: calc(-1 * clamp(8px, 1.2vh, 16px));
    }

    .ticker-label {
      background-color: var(--accent-blue);
      color: #ffffff;
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      z-index: 2;
      font-size: clamp(0.7rem, 1vh, 0.8rem);
      letter-spacing: 0.5px;
    }

    .ticker-conteudo {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .ticker-texto {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: ticker-animacao 25s linear infinite;
    }

    .ticker-item {
      display: inline-flex;
      align-items: center;
      margin-right: 30px;
    }

    .ticker-separador {
      margin-left: 30px;
      color: #38bdf8;
      opacity: 0.7;
    }

    .badge-perigo {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      margin-left: 6px;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    @keyframes ticker-animacao {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
  </style>
</head>
<body>

  <section>

  <!-- RODAPÉ METEOROLÓGICO IPMA -->
  <footer class="rodape-ticker">

      <i class="fa-solid fa-cloud-sun"></i> IPMA BRAGA
    </div>
    <div class="ticker-conteudo">

        <span class="ticker-item">A obter dados oficiais do IPMA...</span>
      </div>

  <script>
    const SHEET_ID = '1ma86jNoDbIG9acIgHx6imCPWWjKVZ-ka3k1mF61BtXo';
    
    // GIDs das abas do Google Sheets
    const GID_TO = '1346973124';          // Aba Teatro de Operações / Canais
    const GID_AGENDAMENTOS = '1209384525';  // Aba Agendamentos
    const GID_OBSERVACOES = '1563121154';   // Aba Observações

    const URL_VIATURAS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const URL_TO = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_TO}`;
    const URL_AGENDAMENTOS = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_AGENDAMENTOS}`;
    const URL_OBSERVACOES = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_OBSERVACOES}`;

    // API ENDPOINTS DO IPMA
    const URL_IPMA_METEO = 'https://api.ipma.pt/open-data/forecast/meteorology/cities/daily/1030300.json'; // Braga
    const URL_IPMA_TIPOS = 'https://api.ipma.pt/open-data/weather-type-classe.json';                      // Tipos de tempo
    const URL_IPMA_RCM = 'https://api.ipma.pt/open-data/forecast/meteorology/rcm/rcm-dico.json';          // Perigo de Incêndio Rural
    const DICO_BRAGA = '0303'; // Código DICO do Concelho de Braga

    // Função que devolve o HTML SVG inline de acordo com o tipo de viatura
    function obterSVGSimboloViatura(nomeViatura) {
      const nomeUpper = nomeViatura.toUpperCase();

      // Ambulância (ABSC / AMB)
      if (nomeUpper.includes('ABSC') || nomeUpper.includes('AMBUL') || nomeUpper.includes('ABSU')) {
        return `<svg viewBox="0 0 24 24"><path d="M19 8h-2V5c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h1c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h1c1.1 0 2-.9 2-2v-5l-3-4zM7 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-6.5H9v2H7v-2H5v-2h2V8h2v2h2v2zm7 6.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1-5.5h-3.5V8.5H17l2 2.5v3z"/></svg>`;
      }
      // Veículos Florestais / Rurais (VFCI / VTTU)
      if (nomeUpper.includes('VFCI') || nomeUpper.includes('VTTU')) {
        return `<svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5C5.17 18.5 4.5 17.83 4.5 17s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm12 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM17 12V9.5h1.5l1.5 2.5H17zM12 3l-2 3h1.5v3h1V6H14L12 3z"/></svg>`;
      }
      // Veículos Urbanos / Industriais (VLCI / VECI / VACB)
      if (nomeUpper.includes('VLCI') || nomeUpper.includes('VECI') || nomeUpper.includes('VACB')) {
        return `<svg viewBox="0 0 24 24"><path d="M22 12v5c0 1.1-.9 2-2 2h-1c0 1.66-1.34 3-3 3s-3-1.34-3-3H9c0 1.66-1.34 3-3 3S3 20.66 3 19H2v-7c0-1.1.9-2 2-2h12l3-5h3c1.1 0 2 .9 2 2v3zM6 19.5c.83 0 1.5-.67 1.5-1.5S6.83 16.5 6 16.5 4.5 17.17 4.5 18s.67 1.5 1.5 1.5zm10 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5zM18 10h2.5l-1.8-3H18v3zM4 12v3h6v-3H4zm8 0v3h4v-3h-4z"/></svg>`;
      }
      // Tanques / Grandes Capacidades (VTTG / VTAA / TANQUE)
      if (nomeUpper.includes('VTTG') || nomeUpper.includes('VTAA') || nomeUpper.includes('TANQUE')) {
        return `<svg viewBox="0 0 24 24"><path d="M18 7c-1.1 0-2 .9-2 2v1H2v7c0 1.1.9 2 2 2h1c0 1.66 1.34 3 3 3s3-1.34 3-3h4c0 1.66 1.34 3 3 3s3-1.34 3-3h2c1.1 0 2-.9 2-2v-5l-2-2h-2zm-10 12c-.83 0-1.5-.67-1.5-1.5S7.17 16 8 16s1.5.67 1.5 1.5S8.83 19 8 19zm8 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm2-5.5V11h1.5l1 2.5H18z"/></svg>`;
      }
      // Escada / Plataforma (VP / VE / ESCADA)
      if (nomeUpper.includes('VP') || nomeUpper.includes('VE') || nomeUpper.includes('ESCADA')) {
        return `<svg viewBox="0 0 24 24"><path d="M19 12v5c0 1.1-.9 2-2 2h-1c0 1.66-1.34 3-3 3s-3-1.34-3-3H9c0 1.66-1.34 3-3 3S3 20.66 3 19H2v-7h17zm-13 7.5c.83 0 1.5-.67 1.5-1.5S6.83 16.5 6 16.5 4.5 17.17 4.5 18s.67 1.5 1.5 1.5zm9 0c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5zM2 8l18-3v2L2 10V8zm2-4l18-3v2L4 6V4z"/></svg>`;
      }

      // Ícone padrão para outras viaturas de emergência
      return `<svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4h14v4z"/><circle cx="7.5" cy="15" r="1.5"/><circle cx="16.5" cy="15" r="1.5"/></svg>`;
    }

    // Mapeamento dos níveis de Risco de Incêndio Rural (RCM)
    function obterNivelPerigoIncendio(rcmVal) {
      const niveis = {
        1: { texto: 'Reduzido', bg: '#10b981', color: '#ffffff', icone: '🟢' },
        2: { texto: 'Moderado', bg: '#eab308', color: '#000000', icone: '🟡' },
        3: { texto: 'Elevado', bg: '#f97316', color: '#ffffff', icone: '🟠' },
        4: { texto: 'Muito Elevado', bg: '#ef4444', color: '#ffffff', icone: '🔴' },
        5: { texto: 'Máximo', bg: '#a855f7', color: '#ffffff', icone: '🟣' }
      };
      return niveis[rcmVal] || { texto: 'N/A', bg: '#64748b', color: '#ffffff', icone: '⚪' };
    }

    async function carregarMeteoIPMA() {
      const containerTicker = document.getElementById('ticker-texto');
      if (!containerTicker) return;

      try {
        const [resMeteo, resTipos, resRcm] = await Promise.all([
          fetch(URL_IPMA_METEO),
          fetch(URL_IPMA_TIPOS),
          fetch(URL_IPMA_RCM).catch(() => null)
        ]);

        if (!resMeteo.ok || !resTipos.ok) throw new Error("Erro ao consultar a API do IPMA");

        const dataMeteo = await resMeteo.json();
        const dataTipos = await resTipos.json();

        // 1. Dados de temperatura e estado do tempo de hoje
        const previsaoHoje = dataMeteo.data[0];
        const tMin = Math.round(previsaoHoje.tMin);
        const tMax = Math.round(previsaoHoje.tMax);
        const probChuva = previsaoHoje.precipitaProb;
        const idTipoTempo = previsaoHoje.idWeatherType;

        const tipoObjeto = dataTipos.data.find(t => t.idWeatherType === idTipoTempo);
        const descTempo = tipoObjeto ? tipoObjeto.descWeatherTypePT : 'Tempo Variável';

        // 2. Dados de Perigo de Incêndio Rural (RCM) para o concelho de Braga
        let perigoIncendioHTML = '🔥 <strong>Perigo Incêndio Rural:</strong> N/A';
        if (resRcm && resRcm.ok) {
          const dataRcm = await resRcm.json();
          const dataChave = Object.keys(dataRcm)[0];
          if (dataChave && dataRcm[dataChave] && dataRcm[dataChave][DICO_BRAGA]) {
            const rcmVal = dataRcm[dataChave][DICO_BRAGA].rcm;
            const infoRcm = obterNivelPerigoIncendio(rcmVal);
            perigoIncendioHTML = `🔥 <strong>Perigo Incêndio Rural:</strong> ${infoRcm.icone} <span class="badge-perigo" style="background-color: ${infoRcm.bg}; color: ${infoRcm.color};">${infoRcm.texto}</span>`;
          }
        }

        // 3. Montar barra de informações
        const mensagens = [
          `📍 <strong>Braga (IPMA):</strong> ${descTempo}`,
          `🌡️ <strong>Máx / Mín Hoje:</strong> ${tMax}°C / ${tMin}°C`,
          `🌧️ <strong>Prob. de Chuva:</strong> ${probChuva}%`,
          perigoIncendioHTML
        ];

        containerTicker.innerHTML = mensagens
          .map(msg => `<span class="ticker-item">${msg}</span>`)
          .join('<span class="ticker-separador">✦</span>');

      } catch (err) {
        console.error("Erro ao carregar IPMA:", err);
        containerTicker.innerHTML = `<span class="ticker-item">⚠️ Impossível obter os dados do IPMA de momento.</span>`;
      }
    }

    function parseCSV(text) {
      const linhas = text.split(/\r?\n/).filter(l => l.trim() !== '');
      if (linhas.length < 2) return [];

      const parseLinha = (linha) => {
        const res = [];
        let cur = '';
        let dentroAspas = false;
        for (let i = 0; i < linha.length; i++) {
          const c = linha[i];
          if (c === '"') dentroAspas = !dentroAspas;
          else if (c === ',' && !dentroAspas) {
            res.push(cur.trim().replace(/^"|"$/g, ''));
            cur = '';
          } else {
            cur += c;
          }
        }
        res.push(cur.trim().replace(/^"|"$/g, ''));
        return res;
      };

      const cabecalhos = parseLinha(linhas[0]);
      return linhas.slice(1).map(linha => {
        const valores = parseLinha(linha);
        const obj = {};
        cabecalhos.forEach((cabecalho, idx) => {
          obj[cabecalho.trim()] = valores[idx] || '';
        });
        return obj;
      });
    }

    function extrairObjetoData(str) {
      if (!str) return null;
      const match = str.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/i);
      if (match) {
        return new Date(parseInt(match[1]), parseInt(match[2]), parseInt(match[3]));
      }
      const partes = str.split('/');
      if (partes.length === 3) {
        return new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
      }
      return null;
    }

    function formatarDataHora(dataValor, horaValor) {
      function extrairComponentes(str) {
        if (!str) return null;
        const match = str.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)/i);
        if (match) {
          const ano = parseInt(match[1]);
          const mes = parseInt(match[2]) + 1;
          const dia = parseInt(match[3]);
          const hora = match[4] !== undefined ? parseInt(match[4]) : null;
          const min = match[5] !== undefined ? parseInt(match[5]) : null;
          return { ano, mes, dia, hora, min };
        }
        return null;
      }

      let dataTexto = '';
      let horaTexto = '';

      const dObj = extrairComponentes(dataValor);
      if (dObj && dObj.ano > 1900) {
        dataTexto = `${String(dObj.dia).padStart(2, '0')}/${String(dObj.mes).padStart(2, '0')}/${dObj.ano}`;
      } else if (dataValor && !dataValor.includes('Date(')) {
        dataTexto = dataValor;
      }

      const hObj = extrairComponentes(horaValor) || extrairComponentes(dataValor);
      if (hObj && hObj.hora !== null) {
        horaTexto = `${String(hObj.hora).padStart(2, '0')}:${String(hObj.min).padStart(2, '0')}`;
      } else if (horaValor && !horaValor.includes('Date(')) {
        horaTexto = horaValor;
      }

      if (dataTexto && horaTexto) return `${dataTexto} às ${horaTexto}`;
      if (dataTexto) return dataTexto;
      if (horaTexto) return horaTexto;
      return 'Sem Data/Hora';
    }

    // 1. TEATRO DE OPERAÇÕES / CANAIS
    async function carregarTeatroOperacoes() {
      try {
        const res = await fetch(`${URL_TO}&_t=${Date.now()}`);
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-to');
        container.innerHTML = '';

        const dadosComCanal = dados.filter(item => {
          const canal = (item['Canais'] || item['Canal'] || item['SIRESP'] || item['BSB'] || item['Estado Operacional'] || '').trim();
          return canal !== '' && canal !== '-' && canal.toUpperCase() !== 'N/A';
        });

        if (dadosComCanal.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem canais/rádios atribuídos de momento.</div>`;
          return;
        }

        dadosComCanal.forEach(item => {
          const evento = item['Evento'] || item['Ocorrência'] || item['Teatro de Operações'] || item['TO'] || item['Veículo'] || item['Viatura'] || 'Rádio / Canal';
          const local = item['Local'] || item['Localização'] || '';
          const canais = item['Canais'] || item['Canal'] || item['SIRESP'] || item['BSB'] || item['Estado Operacional'] || '';

          const div = document.createElement('div');
          div.className = 'card card-to';
          div.innerHTML = `
            <div class="to-nome">${evento}</div>
            <div class="to-detalhes">
              ${local ? `<div>📍 <strong>Local:</strong> ${local}</div>` : ''}
              <div>📻 <strong>Canal:</strong> <span class="badge-canal">${canais}</span></div>
            </div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro ao carregar Teatro de Operações:", err);
      }
    }

    // 2. VIATURAS INOP (Injeção Vetorial SVG direta)
    async function carregarViaturasINOP() {
      try {
        const res = await fetch(`${URL_VIATURAS}&_t=${Date.now()}`);
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-inop');
        container.innerHTML = '';

        const viaturasInop = dados.filter(v => {
          const estado = (v['Estado Operacional'] || v['Estado'] || '').toUpperCase();
          return estado.includes('INOP') || estado.includes('INOPERACIONAL');
        });

        if (viaturasInop.length === 0) {
          container.innerHTML = `<div class="card sem-registos" style="color: var(--accent-green);">✓ Todas as viaturas estão operacionais.</div>`;
          return;
        }

        viaturasInop.forEach(v => {
          const nome = v['Viatura'] || v['Veículo'] || 'N/A';
          const motivo = v['Motivo'] || v['Avaria'] || v['Observações'] || 'Avaria Registada';
          const svgCode = obterSVGSimboloViatura(nome);

          const div = document.createElement('div');
          div.className = 'card card-inop';
          div.innerHTML = `
            <div class="inop-esquerda">
              <div class="inop-icon-box">
                ${svgCode}
              </div>
              <div class="inop-info">
                <h4>${nome}</h4>
                <p>${motivo}</p>
              </div>
            </div>
            <span class="badge-inop">INOP</span>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro ao carregar viaturas INOP:", err);
      }
    }

    // 3. AGENDAMENTOS (Exibe APENAS no próprio dia)
    async function carregarAgendamentos() {
      try {
        const res = await fetch(`${URL_AGENDAMENTOS}&_t=${Date.now()}`);
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-agendamentos');
        container.innerHTML = '';

        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);

        const agendamentosAtivos = dados.filter(item => {
          const dataRaw = item['Data'] || item['Data/Hora'] || '';
          if (!dataRaw) return false;

          const dataEvento = extrairObjetoData(dataRaw);
          if (!dataEvento) return false;

          dataEvento.setHours(0, 0, 0, 0);
          return dataEvento.getTime() === hoje.getTime(); 
        });

        if (agendamentosAtivos.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem agendamentos previstos para hoje.</div>`;
          return;
        }

        agendamentosAtivos.forEach(item => {
          const dataRaw = item['Data'] || item['Data/Hora'] || '';
          const horaRaw = item['Hora'] || '';
          const dataHoraFormatada = formatarDataHora(dataRaw, horaRaw);

          const descricao = item['Descrição'] || item['Descricao'] || item['Evento'] || item['Serviço'] || 'Agendamento / Prevenção';
          const meios = item['Meios'] || item['Meios Alocados'] || item['Meios alocados'] || item['Recursos'] || '';

          const div = document.createElement('div');
          div.className = 'card card-agendamento';
          div.innerHTML = `
            <div class="agendamento-data">📅 ${dataHoraFormatada}</div>
            <div class="agendamento-desc">${descricao}</div>
            ${meios ? `<div class="agendamento-meios">🚒 Meios: ${meios}</div>` : ''}
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro ao carregar agendamentos:", err);
      }
    }

    // 4. OBSERVAÇÕES
    async function carregarObservacoes() {
      try {
        const res = await fetch(`${URL_OBSERVACOES}&_t=${Date.now()}`);
        const csvTexto = await res.text();
        const dados = parseCSV(csvTexto);

        const container = document.getElementById('container-observacoes');
        container.innerHTML = '';

        const listaObs = dados.filter(item => {
          const obs = (item['Observações'] || item['Observação'] || item['Obs'] || '').trim();
          const estado = (item['Estado'] || 'Ativo').toUpperCase();
          return obs !== '' && obs !== '-' && !estado.includes('INATIVO');
        });

        if (listaObs.length === 0) {
          container.innerHTML = `<div class="card sem-registos">Sem observações registadas.</div>`;
          return;
        }

        listaObs.forEach(item => {
          const titulo = item['Título'] || item['Titulo'] || '';
          const obsTexto = item['Observações'] || item['Observação'] || item['Obs'] || '';

          const div = document.createElement('div');
          div.className = 'card card-observacao';
          div.innerHTML = `
            ${titulo ? `<div class="obs-titulo">📌 ${titulo}</div>` : ''}
            <div class="obs-texto">${obsTexto}</div>
          `;
          container.appendChild(div);
        });

      } catch (err) {
        console.error("Erro ao carregar observações:", err);
      }
    }

    function carregarTodosOsDados() {
      carregarTeatroOperacoes();
      carregarViaturasINOP();
      carregarAgendamentos();
      carregarObservacoes();
      carregarMeteoIPMA();
    }

    setInterval(carregarTodosOsDados, 10000);
    carregarTodosOsDados();
  </script>
</body>
</html>
