<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Operacional - Batalhão de Sapadores Bombeiros de Braga</title>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --red-accent: #ef4444;
            --green-accent: #22c55e;
            --blue-accent: #3b82f6;
            --orange-accent: #f97316;
            --yellow-accent: #eab308;
            --purple-accent: #a855f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Modos para Videowall */
        body.is-display {
            padding: 10px;
            overflow: hidden;
        }

        /* Top Header Bar */
        header {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title i {
            color: var(--red-accent);
            font-size: 1.8rem;
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header-title span {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
        }

        .header-clock {
            text-align: right;
        }

        .clock-time {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-main);
            font-family: monospace;
        }

        .clock-date {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Layout Principal Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .panel-header h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header .badge {
            background-color: #334155;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .panel-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: calc(100vh - 150px);
        }

        /* Cards de Veículos INOP */
        .vehicle-card {
            background-color: #0f172a;
            border-left: 4px solid var(--red-accent);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .vehicle-icon-box {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--red-accent);
            width: 40px;
            height: 40px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .vehicle-info {
            flex: 1;
        }

        .vehicle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vehicle-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .status-tag {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--red-accent);
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .vehicle-details {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Cards de Teatro de Operações / Canais */
        .to-card {
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .to-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--blue-accent);
        }

        .to-channels {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .channel-tag-group {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            background-color: #1e293b;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
        }

        .channel-type {
            color: var(--text-muted);
            font-size: 0.7rem;
            font-weight: bold;
        }

        .tag-channel {
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
        }

        .tag-bsb { background-color: var(--red-accent); color: white; }
        .tag-rob-manobra { background-color: var(--orange-accent); color: white; }
        .tag-siresp { background-color: var(--blue-accent); color: white; }
        .tag-extra { background-color: var(--purple-accent); color: white; }

        /* Cards de Eventos / Agendamentos */
        .event-card {
            background-color: #0f172a;
            border-left: 3px solid var(--card-border);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .event-card.event-active {
            border-left-color: var(--green-accent);
            background-color: rgba(34, 197, 94, 0.05);
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="header-title">
            <i class="fa-solid fa-fire-extinguisher"></i>
            <div>
                <h1>BSB Braga — Centro de Meios</h1>
                <span>Painel de Monitorização Operacional</span>
            </div>
        </div>
        <div class="header-clock">
            <div class="clock-time" id="clock-time">00:00:00</div>
            <div class="clock-date" id="clock-date">--,-- -- ----</div>
        </div>
    </header>

    <!-- Grid do Dashboard -->
    <div class="dashboard-grid">

        <!-- Coluna 1: Meios Terrestres (INOP) -->
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-truck-medical" style="color: var(--red-accent);"></i> Meios Inoperacionais</h2>
                <span class="badge" id="inop-count">0 Veículos</span>
            </div>
            <div class="panel-content" id="inop-vehicles-container">
                <!-- Conteúdo gerado dinamicamente via Google Sheets -->
            </div>
        </div>

        <!-- Coluna 2: Canais Rádio / TO -->
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-tower-cell" style="color: var(--blue-accent);"></i> Teatros de Operações / Canais</h2>
                <span class="badge" id="total-vehicles-count">Rede Rádio</span>
            </div>
            <div class="panel-content" id="to-list-container">
                <!-- Conteúdo gerado dinamicamente via Google Sheets -->
            </div>
        </div>

        <!-- Coluna 3: Agendamentos e Eventos -->
        <div class="panel">
            <div class="panel-header">
                <h2><i class="fa-solid fa-calendar-days" style="color: var(--orange-accent);"></i> Agendamentos / Serviços</h2>
                <span class="badge">Agenda</span>
            </div>
            <div class="panel-content" id="events-container">
                <!-- Conteúdo gerado dinamicamente via Google Sheets -->
            </div>
        </div>

    </div>

    <!-- Script de Integração com Google Sheets -->
    <script>
        // ID do seu Google Sheet
        const SPREADSHEET_ID = '1ma86jNoDbIG9acIgHx6imCPWWjKVZ-ka3k1mF61BtXo';
        
        // GIDs exatos das suas 3 abas
        const GIDS = {
            meios: '156124345',   // Aba: Meios Terrestres
            radio: '1209384525',  // Aba: Canais Radio
            agenda: '1346973124'  // Aba: Agendamentos
        };

        let appState = {
            vehicles: [],
            tos: [],
            events: []
        };

        // Ativa Modo Projeção/Display se a URL tiver ?mode=display
        if (window.location.search.includes('mode=display')) {
            document.body.classList.add('is-display');
        }

        // Relógio Digital
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-PT');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('pt-PT', options);
            document.getElementById('clock-date').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Processador de CSV
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',').map(h => h.replace(/^"(.*)"$/, '$1').trim());
            const results = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
                if (values.length === 0) continue;
                
                let row = {};
                headers.forEach((h, index) => {
                    let val = values[index] ? values[index].trim().replace(/^"(.*)"$/, '$1') : '';
                    row[h] = val;
                });
                results.push(row);
            }
            return results;
        }

        // Sincronização Automática com o Google Sheets
        async function syncWithGoogleSheets() {
            try {
                // 1. Ler Meios Terrestres
                const meiosUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GIDS.meios}`;
                const resMeios = await fetch(meiosUrl);
                if (resMeios.ok) {
                    const csvData = await resMeios.text();
                    const rows = parseCSV(csvData);
                    
                    appState.vehicles = rows.map(r => {
                        const nome = r['Veículo / Meio Terrestre'] || r['Veículo'] || '';
                        const estado = (r['Estado Operacional'] || '').toUpperCase();
                        const isInop = estado.includes('INOP');
                        
                        return {
                            id: nome,
                            type: 'Veículo Operacional',
                            icon: 'fa-truck',
                            status: isInop ? 'INOP' : 'OP',
                            motive: r['Observações'] || '',
                            inopSince: ''
                        };
                    }).filter(v => v.id !== '');
                }

                // 2. Ler Canais Rádio / Teatro de Operações
                const radioUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GIDS.radio}`;
                const resRadio = await fetch(radioUrl);
                if (resRadio.ok) {
                    const csvData = await resRadio.text();
                    const rows = parseCSV(csvData);
                    
                    const toMap = {};
                    rows.forEach(r => {
                        const to = r['Teatro Operações'] || 'Ocorrência Geral';
                        const rede = (r['Rede Rádio'] || '').toUpperCase();
                        const canal = r['Canal'] || '';

                        if (!toMap[to]) {
                            toMap[to] = { local: to, bsb: '', rob: '', siresp: '', extra: '' };
                        }

                        if (rede.includes('BSB')) toMap[to].bsb = canal;
                        else if (rede.includes('ROB')) toMap[to].rob = canal;
                        else if (rede.includes('SIRESP')) toMap[to].siresp = canal;
                        else if (rede.includes('EXTRA')) toMap[to].extra = canal;
                    });

                    appState.tos = Object.values(toMap);
                }

                // 3. Ler Agendamentos / Eventos
                const agendaUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GIDS.agenda}`;
                const resAgenda = await fetch(agendaUrl);
                if (resAgenda.ok) {
                    const csvData = await resAgenda.text();
                    const rows = parseCSV(csvData);
                    
                    appState.events = rows.map(r => ({
                        title: `${r['Tipo de Evento / Serviço'] || ''} ${r['Descrição'] ? '- ' + r['Descrição'] : ''}`.trim(),
                        date: r['Data / Hora'] || '',
                        time: r['Responsável'] ? `Resp: ${r['Responsável']}` : '',
                        active: (r['Estado'] || '').toUpperCase().includes('ATIVO')
                    })).filter(e => e.title !== '');
                }

                renderAll();
            } catch (error) {
                console.warn('Erro na sincronização com o Google Sheets...', error);
            }
        }

        function renderAll() {
            renderInopVehicles();
            renderTOs();
            renderEvents();
        }

        function renderInopVehicles() {
            const container = document.getElementById('inop-vehicles-container');
            container.innerHTML = '';

            const inopList = appState.vehicles.filter(v => v.status === 'INOP');
            document.getElementById('inop-count').textContent = `${inopList.length} Veículos`;

            if (inopList.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: var(--green-accent); font-weight: 600;">
                        <i class="fa-solid fa-circle-check" style="font-size: 1.8rem; margin-bottom: 6px; display: block;"></i>
                        Todos os veículos encontram-se Operacionais!
                    </div>`;
                return;
            }

            inopList.forEach(v => {
                const card = document.createElement('div');
                card.className = 'vehicle-card';
                card.innerHTML = `
                    <div class="vehicle-icon-box"><i class="fa-solid ${v.icon}"></i></div>
                    <div class="vehicle-info">
                        <div class="vehicle-header">
                            <span class="vehicle-name">${v.id}</span>
                            <span class="status-tag">INOP</span>
                        </div>
                        <div class="vehicle-details">${v.motive || 'Sem indicação de avaria'}</div>
                    </div>`;
                container.appendChild(card);
            });
        }

        function renderTOs() {
            const container = document.getElementById('to-list-container');
            container.innerHTML = '';

            if (appState.tos.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 15px;">Sem comunicações rádio ativas.</div>`;
                return;
            }

            appState.tos.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'to-card';
                card.innerHTML = `
                    <div class="to-title-row">
                        <span class="to-location"><i class="fa-solid fa-location-dot"></i> ${item.local}</span>
                    </div>
                    <div class="to-channels">
                        ${item.bsb ? `<div class="channel-tag-group"><span class="channel-type">BSB:</span><span class="tag-channel tag-bsb">${item.bsb}</span></div>` : ''}
                        ${item.rob ? `<div class="channel-tag-group"><span class="channel-type">ROB:</span><span class="tag-channel tag-rob-manobra">${item.rob}</span></div>` : ''}
                        ${item.siresp ? `<div class="channel-tag-group"><span class="channel-type">SIRESP:</span><span class="tag-channel tag-siresp">${item.siresp}</span></div>` : ''}
                        ${item.extra ? `<div class="channel-tag-group"><span class="channel-type">EXTRA:</span><span class="tag-channel tag-extra">${item.extra}</span></div>` : ''}
                    </div>`;
                container.appendChild(card);
            });
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = '';

            if (appState.events.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 15px;">Sem agendamentos previstos.</div>`;
                return;
            }

            appState.events.forEach((item) => {
                const card = document.createElement('div');
                card.className = `event-card ${item.active ? 'event-active' : ''}`;
                card.innerHTML = `
                    <div>
                        <div style="font-weight: bold; font-size: 0.85rem; color: #fff;">${item.title}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">${item.date} ${item.time}</div>
                    </div>`;
                container.appendChild(card);
            });
        }

        // Consulta e sincroniza automaticamente a cada 10 segundos
        setInterval(syncWithGoogleSheets, 10000);

        // Primeira consulta imediata
        syncWithGoogleSheets();
    </script>
</body>
</html>
